[project]
name = "mxenergy"
version = "2.0.0"
description = "Síntesis diaria del sector energético de México: DOF y prensa especializada, filtrada por reglas (sin IA)."
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
