# Reglas del filtro: deciden qué publicaciones del DOF aparecen como relevantes
# y con qué categorías se etiquetan las noticias. No usan IA: son listas de
# términos, revisables y corregibles aquí mismo.
#
# Cómo se lee un término:
#   - Se compara sin acentos ni mayúsculas y como frase completa
#     («cfe» no coincide dentro de «cfecto»).
#   - Con * al final es prefijo: «eólic*» = eólica, eólico, eólicas…
#   - Con «re:» delante es una expresión regular sobre el texto normalizado
#     (minúsculas, sin acentos, solo letras, números y puntos).
#
# Puntaje de cada publicación (el de su mejor categoría, +1 si dos categorías
# llegan a 2 o más):
#   - dependencia del DOF de la lista `dependencias`: sus `puntos`;
#   - término en el título: `peso_titulo` de la categoría;
#   - términos en el texto (solo categorías con cuenta_texto): 1 por término
#     distinto, hasta `max_texto`;
#   - fracción arancelaria en el texto: `puntos_fraccion`.
#   - `techo` (opcional) limita lo que puede sumar una categoría sola.
#
# `noticias`: términos que solo se usan con noticias (en el DOF serían ambiguos,
# como «transmisión» o «módulos»). En las noticias las categorías sirven de
# filtro: todas las fuentes ya son del sector.
#
# Convocatorias y avisos del DOF (sección de licitaciones y avisos): se
# clasifican por su objeto y su texto; quien publica aporta 1 punto como máximo.
# Prioridad: alta ≥ 3, media = 2, baja = 1. Sin puntaje: no aparece entre las
# relevantes (sigue en «Todas las publicaciones del DOF» y en la búsqueda).
#
# Un push que cambia este archivo dispara una corrida que reclasifica todo el
# historial con las reglas nuevas.

umbrales:
  alta: 3
  media: 2
  baja: 1

